<!-- SESSION BAR -->
<div class="session-bar" id="session-bar" style="display:none;">
    <div class="sb-grader">
        <div class="sb-grader-avatar" id="sb-avatar">?</div>
        <div>
            <div class="sb-grader-name" id="sb-grader-name">—</div>
            <div class="sb-grader-lbl">Grader</div>
        </div>
    </div>
    <div class="sb-location">
        <div class="sb-loc-prefix">TCL —</div>
        <select class="sb-loc-input" id="sb-loc-input" onchange="onLocInput()">
            <option value="">Select location…</option>
            <option value="Location-1">Location-1</option>
            <option value="Location-2">Location-2</option>
            <option value="Location-3">Location-3</option>
            <option value="Location-4">Location-4</option>
            <option value="Location-5">Location-5</option>
        </select>
    </div>
    <div class="sb-status">
        <div class="sb-status-dot"></div>
        <div>
            <div class="sb-status-val" id="sb-scan-count">0</div>
            <div class="sb-status-lbl">scans</div>
        </div>
    </div>
</div>
