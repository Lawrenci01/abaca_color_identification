<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Abaca Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/screens.css">
    <style>
        /* ── BOOT LOADER ─────────────────────────────────────────── */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f9f6;
            gap: 12px;
        }

        #boot-loader .bl-icon {
            font-size: 2.5rem;
            animation: blspin 1.2s linear infinite;
        }

        @keyframes blspin {
            to {
                transform: rotate(360deg);
            }
        }

        #boot-loader .bl-text {
            font-size: .8rem;
            color: #888;
            font-family: sans-serif;
        }

        body.booted #boot-loader {
            display: none;
        }

        /* ══════════════════════════════════════════════════════════
           MOBILE LAYOUT SYSTEM

           Architecture on mobile:
             body  (flex column, height: 100dvh, overflow: hidden)
               ├── .topbar        (flex-shrink: 0, exact height)
               ├── .session-bar   (flex-shrink: 0, exact height)
               ├── #app           (flex: 1, overflow: hidden)
               │     └── .screen  (position: absolute, inset: 0, overflow-y: auto)
               └── .nav           (position: fixed, bottom: 0)

           The key insight:
           - body must be EXACTLY the viewport height — use 100dvh
           - topbar and session-bar must have FIXED heights, flex-shrink: 0
           - safe-area padding goes on BODY ONLY — not on topbar again
           - #app fills ALL remaining space with flex: 1
           - screens are absolutely positioned inside #app, scroll internally
           - nav is fixed at bottom — screens pad their bottom to clear it
        ══════════════════════════════════════════════════════════ */

        @media (max-width: 899px) {

            /* 1. Body: exact viewport, flex column, safe-area on top only */
            html {
                height: 100%;
                height: 100dvh;
            }

            body {
                height: 100%;
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                /* safe-area ONLY here — never add it to child elements again */
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: 0;
            }

            /* 2. Topbar: exact fixed height, never shrinks, no extra padding */
            .topbar {
                flex: 0 0 var(--topbar-h) !important;
                height: var(--topbar-h) !important;
                min-height: var(--topbar-h) !important;
                max-height: var(--topbar-h) !important;
                /* Override base.css which double-counts safe-area */
                padding-top: 0 !important;
                position: relative !important;
                z-index: 50;
                flex-shrink: 0 !important;
            }

            /* 3. Session bar mount div: zero size, just a slot */
            #session-bar-mount {
                display: contents;
            }

            /* 4. Session bar: exact fixed height, never shrinks */
            .session-bar {
                flex: 0 0 var(--session-h) !important;
                height: var(--session-h) !important;
                min-height: var(--session-h) !important;
                max-height: var(--session-h) !important;
                position: relative !important;
                z-index: 39;
                flex-shrink: 0 !important;
                width: 100% !important;
            }

            /* 5. App container: takes ALL remaining space */
            #app {
                flex: 1 1 0 !important;
                min-height: 0 !important; /* CRITICAL: allows flex child to shrink */
                overflow: hidden !important;
                position: relative !important;
            }

            /* 6. All screens: fill #app, scroll internally */
            .screen {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                -webkit-overflow-scrolling: touch;
                display: none;
                /* Bottom padding clears the fixed nav + home indicator */
                padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px) !important;
            }

            .screen.active {
                display: block !important;
            }

            /* 7. Nav: fixed at bottom, safe-area aware */
            .nav {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)) !important;
                padding-bottom: env(safe-area-inset-bottom, 0px) !important;
                z-index: 100;
            }

            /* 8. Scanner screen — enable full scrolling */
            #screen-scanner {
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
            }

            /* 9. Scanner inner divs — must NOT restrict height or overflow */
            #scanner-guide,
            #scanner-preview,
            #scanner-spinner,
            #scan-result-panel {
                width: 100%;
                /* NO height, NO overflow — let the parent screen scroll */
            }

            /* 10. Scanner action bar (Reset + Crop & Analyze): sticky above nav */
            #scanner-action-bar {
                position: sticky;
                bottom: 0;
                z-index: 20;
                background: var(--bg);
                border-top: 1px solid var(--border);
                padding: 8px 16px;
                padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
            }

            /* 11. Result panel save buttons: sticky above nav */
            .scan-result-panel .btn-row {
                position: sticky;
                bottom: 0;
                z-index: 10;
                background: var(--card);
                border-top: 1px solid var(--border);
                padding: 10px 16px;
                padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
                margin-left: -16px;
                margin-right: -16px;
            }

            /* 12. Quality modal: centered above nav */
            #quality-modal {
                position: fixed;
                inset: 0;
                z-index: 400;
                background: rgba(0, 0, 0, .55);
                display: none;
                align-items: flex-end;
                justify-content: center;
            }

            #quality-modal .qm {
                border-radius: 20px 20px 0 0;
                padding: 20px 16px;
                padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                width: 100%;
                max-width: 480px;
                background: var(--card);
            }

            /* 13. Camera overlay buttons: safe area */
            .cam-btns-wrap {
                padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            }

            /* 14. Detail modal: true full screen */
            #detail-modal {
                padding: 0 !important;
            }

            #detail-modal.open {
                display: block !important;
            }

            .dm {
                min-height: 100dvh;
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            }

            .dm-topbar {
                padding-top: max(14px, 0px);
            }

            /* 15. Error toast: above nav */
            #err-toast {
                bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px);
                z-index: 300;
            }

            /* 16. Location toast: below session bar */
            #loc-toast {
                top: calc(var(--topbar-h) + var(--session-h) + 8px);
                z-index: 200;
            }

            /* 17. Preview wrap: touch-friendly, no overflow */
            .preview-wrap {
                overflow: hidden;
                touch-action: none;
            }

            /* 18. Dropdowns: scrollable, don't go off screen */
            .filter-dropdown,
            .admin-dropdown {
                max-height: 220px;
                overflow-y: auto;
            }

            /* 19. Small screens ≤360px */
            @media (max-width: 360px) {
                .color-info-row {
                    flex-wrap: wrap;
                    gap: 4px;
                }

                #scanner-action-bar .btn {
                    padding: 9px 10px;
                    font-size: .78rem;
                }
            }

        }

        /* end @media mobile */

        /* ── DESKTOP: undo all mobile overrides ────────────────── */
        @media (min-width: 900px) {
            body {
                padding-top: 0 !important;
            }

            .topbar {
                flex: none !important;
                /* Desktop: body has no padding-top, so topbar absorbs safe-area itself */
                height: calc(var(--topbar-h) + env(safe-area-inset-top)) !important;
                padding-top: env(safe-area-inset-top) !important;
                position: fixed !important;
                top: 0;
                left: 0;
                right: 0;
                z-index: 200;
            }

            .session-bar {
                position: fixed !important;
                top: var(--topbar-h);
                left: var(--sidebar-w, 240px);
                right: 0;
                height: var(--session-h) !important;
                z-index: 150;
            }

            #session-bar-mount {
                display: block;
            }

            #app {
                position: fixed !important;
                top: calc(var(--topbar-h) + var(--session-h));
                left: var(--sidebar-w, 240px);
                right: 0;
                bottom: 0;
                flex: none !important;
                overflow: hidden !important;
            }

            .screen {
                position: absolute !important;
                inset: 0 !important;
                overflow-y: auto !important;
                padding-bottom: 40px !important;
            }

            .nav {
                position: fixed !important;
                height: var(--nav-h) !important;
                padding-bottom: 0 !important;
            }

            #scanner-action-bar {
                position: static;
                border-top: none;
                background: transparent;
                padding: 8px 16px;
            }

            .scan-result-panel .btn-row {
                position: static;
                border-top: none;
                background: transparent;
                padding: 8px 0;
                margin: 0;
            }

            #quality-modal .qm {
                border-radius: 16px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>

<!-- BOOT LOADER — shown until all partials + JS are ready -->
<div id="boot-loader">
    <div class="bl-icon">🌿</div>
    <div class="bl-text">Loading...</div>
</div>

<!-- TOPBAR -->
<div class="topbar" style="display:none;">
    <div class="topbar-left">
        <div class="logo-icon">🌿</div>
        <h1>Abaca Scanner</h1>
    </div>
    <div class="topbar-right">
        <div class="sync-dot" id="sync-dot"></div>
        <div class="topbar-badge" id="topbar-scan-count">0 scans</div>
    </div>
</div>

<!-- SESSION BAR -->
<div id="session-bar-mount" style="display:contents;"></div>

<!-- APP SCREENS -->
<div id="app">
    <div id="login-mount"></div>
    <div id="dashboard-mount"></div>
    <div id="scanner-mount"></div>
    <div id="history-mount"></div>
    <div id="settings-mount"></div>
    <div id="admin-mount"></div>
</div>

<!-- ERROR TOAST -->
<div id="err-toast"><strong id="err-title">Error</strong><span id="err-body"></span></div>

<!-- NAV — hidden by default, shown by showApp() after login -->
<nav class="nav" style="display:none;">
    <div class="nav-item active" id="nav-dashboard" onclick="switchScreen('dashboard')">
        <div class="nav-icon">📊</div>
        <div class="nav-label">Dashboard</div>
    </div>
    <div class="nav-item" id="nav-scanner" onclick="switchScreen('scanner')">
        <div class="nav-icon">📷</div>
        <div class="nav-label">Scanner</div>
    </div>
    <div class="nav-item" id="nav-history" onclick="switchScreen('history')">
        <div class="nav-icon">🕐</div>
        <div class="nav-label">History</div>
    </div>
    <div class="nav-item" id="nav-settings" onclick="switchScreen('settings')">
        <div class="nav-icon">⚙️</div>
        <div class="nav-label">Settings</div>
    </div>
</nav>

<!-- MODALS -->
<div id="modals-mount"></div>

<!-- USER SCANS MODAL -->
<div id="user-scans-modal">
    <div class="usm-sheet">
        <div class="usm-header">
            <div class="usm-avatar" id="usm-avatar">?</div>
            <div class="usm-title">
                <h3 id="usm-username">User</h3>
                <p id="usm-subtitle">Loading scans...</p>
            </div>
            <button class="usm-close" onclick="closeUserScansModal()">&#x2715;</button>
        </div>
        <div class="usm-body" id="usm-body"></div>
    </div>
</div>

<!-- PARTIAL LOADER -->
<script>
    (function () {
        const partials = [
            {url: '/static/pages/session_bar.html', mount: 'session-bar-mount'},
            {url: '/static/pages/login.html', mount: 'login-mount'},
            {url: '/static/pages/dashboard.html', mount: 'dashboard-mount'},
            {url: '/static/pages/scanner.html', mount: 'scanner-mount'},
            {url: '/static/pages/history.html', mount: 'history-mount'},
            {url: '/static/pages/settings.html', mount: 'settings-mount'},
            {url: '/static/pages/admin.html', mount: 'admin-mount'},
            {url: '/static/pages/modals.html', mount: 'modals-mount'},
        ];

        const scripts = [
            '/static/js/state.js',
            '/static/js/dashboard.js',
            '/static/js/history.js',
            '/static/js/scanner.js',
            '/static/js/auth.js',
            '/static/js/detail.js',
            '/static/js/calibration.js',
            '/static/js/admin.js',
            '/static/js/init.js',
        ];

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('Failed to load: ' + src));
                document.body.appendChild(s);
            });
        }

        async function boot() {
            await Promise.all(partials.map(p =>
                    fetch(p.url)
                            .then(r => r.ok ? r.text() : Promise.reject(p.url))
                            .then(html => {
                                document.getElementById(p.mount).innerHTML = html;
                            })
                            .catch(err => console.error('Partial load failed:', err))
            ));

            for (const src of scripts) {
                await loadScript(src);
            }

            if (typeof initScannerEvents === 'function') initScannerEvents();

            // Mark as booted — hides the loading spinner
            document.body.classList.add('booted');

            if (typeof checkSession === 'function') checkSession();
        }

        boot().catch(err => {
            console.error('Boot failed:', err);
            document.getElementById('boot-loader').innerHTML =
                    '<div style="color:red;font-family:sans-serif;padding:20px;text-align:center;">Failed to load app.<br>Please refresh the page.</div>';
        });
    })();
</script>

</body>
</html>
